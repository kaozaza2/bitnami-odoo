name: Build and push Odoo images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["16", "17", "18", "19"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tags from Dockerfile
        id: ver
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^ENV APP_VERSION="\([^"]*\)".*/\1/p' "${{ matrix.version }}/debian-12/Dockerfile")"
          test -n "$APP_VERSION" || { echo "APP_VERSION not found in ${{ matrix.version }}/debian-12/Dockerfile"; exit 1; }
          echo "app=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full=${APP_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${APP_VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.version }}/debian-12
          file: ./${{ matrix.version }}/debian-12/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.major }}
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.full }}
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.app }}