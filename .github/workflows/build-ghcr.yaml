name: Build and push Odoo images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit or branch to build. Defaults to the commit that triggered the
          run, which is not what the caller wants after pushing a new commit of
          its own — pass that commit's SHA instead.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Odoo ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ["16", "17", "18", "19"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve version tags from Dockerfile
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          DF="${{ matrix.version }}/debian-12/Dockerfile"

          APP_VERSION="$(sed -n 's/^ENV APP_VERSION="\([^"]*\)".*/\1/p' "$DF")"

          if [ -z "$APP_VERSION" ]; then
            echo "::error file=${DF}::No 'ENV APP_VERSION=\"...\"' line found — the image tags are derived from it, so the build cannot continue."
            exit 1
          fi

          {
            echo "app=${APP_VERSION}"
            echo "full=${APP_VERSION%.*}"
            echo "major=${APP_VERSION%%.*}"
          } >> "$GITHUB_OUTPUT"

          echo "Odoo ${APP_VERSION} -> tags ${APP_VERSION%%.*}, ${APP_VERSION%.*}, ${APP_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.version }}/debian-12
          file: ./${{ matrix.version }}/debian-12/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.major }}
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.full }}
            ghcr.io/kaozaza2/bitnami-odoo:${{ steps.ver.outputs.app }}

      - name: Summarise pushed tags
        shell: bash
        run: |
          {
            echo "### Odoo ${{ steps.ver.outputs.app }} pushed"
            echo
            for tag in \
              "${{ steps.ver.outputs.major }}" \
              "${{ steps.ver.outputs.full }}" \
              "${{ steps.ver.outputs.app }}"
            do
              echo "- \`ghcr.io/kaozaza2/bitnami-odoo:${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
