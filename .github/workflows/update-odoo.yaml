name: Weekly Odoo nightly bump

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump Odoo nightly pins
        shell: bash
        run: |
          set -euo pipefail
          # format: "<major version>:<python egg tag used in the venv>"
          ENTRIES="16:py3.12 17:py3.12 18:py3.12 19:py3.13"
          for entry in $ENTRIES; do
            V="${entry%%:*}"
            DF="${V}/debian-12/Dockerfile"
            old="$(sed -n 's/^ENV APP_VERSION="\([^"]*\)".*/\1/p' "$DF")"
            old_date="${old##*.}"
            old_sha="$(sed -n 's/.*echo "\([0-9a-f]\{64\}\)  \/tmp\/odoo-source.tar.gz".*/\1/p' "$DF" | head -1)"
            listing="$(curl -fsSL "https://nightly.odoo.com/${V}.0/nightly/tgz/")"
            latest="$(printf '%s\n' "$listing" | grep -oE "odoo_${V}\.0\.[0-9]{8}\.tar\.gz" | sort -u | tail -1)"
            new_date="$(printf '%s' "$latest" | sed -n "s/.*odoo_${V}\.0\.\([0-9]\{8\}\).*/\1/p")"
            if [ -z "$new_date" ]; then
              echo "error: no nightly tgz found for odoo ${V}.0" >&2
              exit 1
            fi
            if [ "$new_date" = "$old_date" ]; then
              echo "v${V}: already on latest nightly ${old_date}"
              continue
            fi
            curl -fsSL "https://nightly.odoo.com/${V}.0/nightly/tgz/odoo_${V}.0.${new_date}.tar.gz" -o "/tmp/odoo-${V}.tgz"
            new_sha="$(shasum -a 256 "/tmp/odoo-${V}.tgz" | awk '{print $1}')"
            rm -f "/tmp/odoo-${V}.tgz"
            sed -i \
              -e "s/${V}\.0\.${old_date}/${V}.0.${new_date}/g" \
              -e "s/odoo-${V}\.0\.post${old_date}/odoo-${V}.0.post${new_date}/g" \
              -e "s/${old_sha}/${new_sha}/g" "$DF"
            sed -i "s/\`${V}.0.${old_date}\`/\`${V}.0.${new_date}\`/g" README.md
            echo "v${V}: ${old_date} -> ${new_date} (sha ${old_sha:0:12}... -> ${new_sha:0:12}...)"
          done

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/odoo-update
          delete-branch: true
          commit-message: "chore: bump Odoo nightly builds to latest"
          title: "chore: bump Odoo nightly builds to latest"
          body: |
            Weekly automatic bump of the pinned Odoo nightly builds.

            For each of 16/17/18/19 the `ENV APP_VERSION`, `image.version` label,
            download URL and SHA-256 in `*/debian-12/Dockerfile` are updated to
            the newest nightly available on `nightly.odoo.com`, and the README
            version table is refreshed.

            Merging triggers the build workflow, which derives the pushed
            `X` / `X.0` / `X.0.<date>` GHCR tags from these Dockerfiles.
          base: main